# Triviara — Fly.io yapılandırması.
# Kurulum adımları için docs/DEPLOY.md dosyasına bakın.
# Ortam değişkenlerinin kanonik listesi: deploy/env.list — değişken
# eklerken/değiştirirken üç platform config'i de ona uyar.

app = "quiztavern"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
# DISCORD_* / SESSION_SECRET / PUBLIC_BASE_URL: `fly secrets set` ile
# (deploy/env.list); VITE_DISCORD_CLIENT_ID build-arg olarak verilir.

# SQLite dosyaları (xp.db, daily.db, question-reports.db) burada tutulur —
# restart/deploy'da kaybolmaz. İlk deploy öncesi:
#   fly volumes create quiztavern_data --region fra --size 1
[mounts]
  source = "quiztavern_data"
  destination = "/app/server/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
    protocol = "http"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
