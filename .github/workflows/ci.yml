name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      # Build önce: prod boot client/dist ister (origin-gate NODE_ENV=production spawn'ı).
      - run: npm run build
      - run: npm test

  # Windows sadece main push'ında koşar: PR kuyruğu zaten seri, Windows
  # gerilemelerini (path/rmSync) merge sonrası yakalamak yeterli (§7.9).
  test-build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
